<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRCraft — Communication</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #161616;
      border-bottom: 1px solid #2a2a2a;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header a {
      color: #666;
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    header a:hover { color: #aaa; }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
    }
    .header-badge {
      background: #e74c3c;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .online-count {
      margin-left: auto;
      font-size: 12px;
      color: #666;
    }
    .online-dot {
      display: inline-block;
      width: 7px; height: 7px;
      background: #2ecc71;
      border-radius: 50%;
      margin-right: 5px;
    }

    /* ── Auth screen ── */
    #auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    #auth-screen .logo { font-size: 40px; }
    #auth-screen h2 { font-size: 20px; font-weight: 700; }
    #auth-screen p { font-size: 14px; color: #777; text-align: center; }
    .google-btn {
      background: #fff;
      color: #333;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .google-btn:hover { opacity: 0.9; }
    .google-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Chat ── */
    #chat-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

    .msg.own { flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #2a2a2a;
    }
    .msg-avatar-placeholder {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .msg-body { max-width: 75%; }
    .msg.own .msg-body { align-items: flex-end; display: flex; flex-direction: column; }

    .msg-name {
      font-size: 11px;
      color: #666;
      margin-bottom: 3px;
    }
    .msg.own .msg-name { text-align: right; }

    .msg-bubble {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 14px 14px 14px 4px;
      padding: 9px 13px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.own .msg-bubble {
      background: #1a3a2a;
      border-color: #2a4a3a;
      border-radius: 14px 14px 4px 14px;
    }

    .msg-time {
      font-size: 10px;
      color: #555;
      margin-top: 3px;
      padding: 0 2px;
    }

    /* system messages */
    .msg-system {
      text-align: center;
      font-size: 12px;
      color: #555;
      padding: 4px 0;
    }

    /* ── Input bar ── */
    #input-bar {
      background: #161616;
      border-top: 1px solid #2a2a2a;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #e0e0e0;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      max-height: 120px;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
    }
    #msg-input:focus { border-color: #444; }
    #msg-input::placeholder { color: #555; }

    #send-btn {
      background: #2ecc71;
      border: none;
      border-radius: 10px;
      width: 42px; height: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send-btn:hover { background: #27ae60; }
    #send-btn:disabled { background: #2a2a2a; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <a href="../">← Orqaga</a>
  <span class="header-title">⛏️ MRCraft</span>
  <span class="header-badge">COMMUNICATION</span>
  <span class="online-count" id="online-count"></span>
</header>

<!-- Auth -->
<div id="auth-screen">
  <div class="logo">💬</div>
  <h2>MRCraft Communication</h2>
  <p>O'yin haqida gaplashing, taklif yoki muammolaringizni yozing.<br>Kirish uchun Google akkauntingizdan foydalaning.</p>
  <button class="google-btn" id="btn-login">
    <svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Google bilan kirish
  </button>
</div>

<!-- Chat -->
<div id="chat-screen" class="hidden">
  <div id="messages">
    <div class="msg-system">Xush kelibsiz! 👋</div>
  </div>
  <div id="input-bar">
    <textarea id="msg-input" rows="1" placeholder="Xabar yozing..." maxlength="500"></textarea>
    <button id="send-btn" disabled>
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getFirestore, collection, addDoc, onSnapshot,
  query, orderBy, limit, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyAgo4ze3DobLkv0G6belK2yHjTptaRH6Z8",
  authDomain: "mrcraft.firebaseapp.com",
  projectId: "mrcraft",
  storageBucket: "mrcraft.firebasestorage.app",
  messagingSenderId: "1036625112887",
  appId: "1:1036625112887:web:767775337ba57ef01674b2"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;

// ── Auth ──
document.getElementById('btn-login').addEventListener('click', async () => {
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Kirilmoqda...';
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg> Google bilan kirish`;
  }
});

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('chat-screen').classList.remove('hidden');
    document.getElementById('send-btn').disabled = false;
    listenMessages();
  } else {
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('chat-screen').classList.add('hidden');
  }
});

// ── Messages ──
const messagesEl = document.getElementById('messages');
let firstLoad = true;

function formatTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString('uz', { hour: '2-digit', minute: '2-digit' });
}

function renderMsg(data, id) {
  const isOwn = currentUser && data.uid === currentUser.uid;
  const div = document.createElement('div');
  div.className = 'msg' + (isOwn ? ' own' : '');
  div.dataset.id = id;

  const avatarEl = data.photoURL
    ? `<img class="msg-avatar" src="${data.photoURL}" alt="">`
    : `<div class="msg-avatar-placeholder">${(data.name || '?')[0].toUpperCase()}</div>`;

  div.innerHTML = `
    ${avatarEl}
    <div class="msg-body">
      <div class="msg-name">${isOwn ? 'Siz' : (data.name || 'Foydalanuvchi')}</div>
      <div class="msg-bubble">${escHtml(data.text)}</div>
      <div class="msg-time">${formatTime(data.createdAt)}</div>
    </div>
  `;
  return div;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function listenMessages() {
  const q = query(collection(db, 'communication'), orderBy('createdAt', 'asc'), limit(100));
  onSnapshot(q, snap => {
    snap.docChanges().forEach(change => {
      if (change.type === 'added') {
        const el = renderMsg(change.doc.data(), change.doc.id);
        messagesEl.appendChild(el);
      }
    });
    if (firstLoad) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
      firstLoad = false;
    } else {
      // faqat pastda bo'lsa auto-scroll
      const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
      if (nearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  });
}

// ── Send ──
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentUser) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  try {
    await addDoc(collection(db, 'communication'), {
      uid:       currentUser.uid,
      name:      currentUser.displayName || 'Anonim',
      photoURL:  currentUser.photoURL || null,
      text,
      createdAt: serverTimestamp(),
    });
  } catch (e) {
    input.value = text;
    console.error(e);
  } finally {
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}

document.getElementById('send-btn').addEventListener('click', sendMessage);

document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// auto-resize textarea
document.getElementById('msg-input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
